version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: emporio_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emporio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emporio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: emporio_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: curlimages/curl:8.11.1
    container_name: emporio_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        curl --fail --retry 10 --retry-delay 3
        -X POST http://ollama:11434/api/pull
        -H 'Content-Type: application/json'
        -d '{"name":"qwen2.5:1.5b","stream":false}'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: emporio_api
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=emporio_db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: emporio_ui
    restart: always
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./src/ui:/app/src/ui
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data: